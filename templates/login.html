<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="allloader">
<title>allloader – Anmelden</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="login">
  <img src="/static/icons/icon.svg" alt="" class="login-icon">
  <h1>allloader</h1>
  <form method="post" action="/login" class="card">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label class="label" for="password">Passwort</label>
    <input type="password" id="password" name="password" class="input" autocomplete="current-password" autofocus required>
    {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
    <button type="submit" class="btn primary block">Anmelden</button>
  </form>
</main>
</body>
</html>
