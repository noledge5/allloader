name: UTS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  uts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        if: ${{ hashFiles('package-lock.json') != '' }}
      - run: node .hierarchie/werkzeuge/uts.mjs
